<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>写真メモビューワー</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --panel-bg: #2b2b36;
      --accent-color: #007acc;
      --text-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー・ツールバー */
    header {
      background-color: var(--panel-bg);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #3a3a4c;
      z-index: 10;
      flex-wrap: wrap;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.btn, button.btn {
      background-color: #3b3b4f;
      color: var(--text-color);
      border: 1px solid #55556a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
      transition: background-color 0.2s;
    }

    label.btn:active, button.btn:active {
      background-color: #55556a;
    }

    button.btn-primary, label.btn-primary {
      background-color: var(--accent-color);
      border-color: #005999;
    }

    /* モード切替ボタンのアクティブ状態 */
    button.btn-mode.active-pen {
      background-color: #ff3b30;
      border-color: #cc2f26;
      color: #fff;
    }

    button.btn-mode.active-move {
      background-color: #34c759;
      border-color: #289c45;
      color: #fff;
    }

    button:disabled, label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    .color-picker {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    /* メインレイアウト */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* ビューワーエリア */
    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121216;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom; /* デフォルトはスクロール・拡大許可 */
    }

    /* ペンモードのときはビューワー自体のスクロールを一時的にロックして書きやすくする */
    .viewer-area.pen-mode {
      touch-action: none;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none; /* デフォルト（移動モード）ではタッチをスルーさせる */
    }

    /* ペンモード有効時はキャンバスでタッチを受け付ける */
    .viewer-area.pen-active #drawCanvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* サムネイル一覧 */
    .sidebar {
      width: 130px;
      background-color: var(--panel-bg);
      border-right: 1px solid #3a3a4c;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    @media (max-width: 600px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 80px;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-top: 1px solid #3a3a4c;
        order: 2;
      }
      .viewer-area {
        order: 1;
      }
      .thumb-item {
        min-width: 70px !important;
        height: 100% !important;
      }
    }

    .thumb-item {
      width: 100%;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background-color: #121216;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item.active {
      border-color: var(--accent-color);
    }

    .empty-state {
      position: absolute;
      text-align: center;
      color: #888899;
      pointer-events: none;
      padding: 20px;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>

　<link rel="apple-touch-icon" href="/PhotoMemo/photomemo.png">
  
</head>
<body>

  <!-- ツールバー -->
  <header>
    <div class="group">
      <label class="btn btn-primary">
        📷 写真を開く
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button class="btn" id="prevBtn" type="button" disabled>前へ</button>
      <button class="btn" id="nextBtn" type="button" disabled>次へ</button>
    </div>

    <div class="group">
      <!-- モード切替ボタン -->
      <button class="btn btn-mode active-move" id="modeBtn" type="button">✋ 移動モード</button>

      <div class="color-picker" id="penToolGroup" style="opacity: 0.5; pointer-events: none;">
        <div class="color-btn active" style="background:#ff3b30;" data-color="#ff3b30"></div>
        <div class="color-btn" style="background:#007aff;" data-color="#007aff"></div>
        <div class="color-btn" style="background:#ffcc00;" data-color="#ffcc00"></div>
        <div class="color-btn" style="background:#34c759;" data-color="#34c759"></div>
        <div class="color-btn" style="background:#ffffff;" data-color="#ffffff"></div>
        <input type="range" id="lineWidth" min="2" max="20" value="4" style="width:50px;">
      </div>

      <button class="btn" id="undoBtn" type="button" disabled>↩</button>
      <button class="btn" id="clearBtn" type="button" disabled>🗑</button>
    </div>

    <div class="group">
      <button class="btn btn-primary" id="saveBtn" type="button" disabled>💾 保存</button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="main-container">
    <div class="sidebar" id="thumbnailList"></div>

    <div class="viewer-area" id="viewerArea">
      <div class="empty-state" id="emptyState">
        <svg width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>「写真を開く」から画像を選択してください</p>
      </div>

      <div class="canvas-container" id="canvasContainer" style="display:none;">
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    let imageList = [];
    let currentIndex = -1;

    let currentImg = new Image();
    let currentColor = '#ff3b30';
    let currentLineWidth = 4;
    let strokes = [];
    let currentStroke = null;
    let isDrawing = false;
    let isPenMode = false; // false = 移動・スクロールモード, true = ペン（手書き）モード

    const fileInput = document.getElementById('fileInput');
    const thumbnailList = document.getElementById('thumbnailList');
    const viewerArea = document.getElementById('viewerArea');
    const canvasContainer = document.getElementById('canvasContainer');
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const saveBtn = document.getElementById('saveBtn');
    const modeBtn = document.getElementById('modeBtn');
    const penToolGroup = document.getElementById('penToolGroup');
    const emptyState = document.getElementById('emptyState');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const lineWidthInput = document.getElementById('lineWidth');

    // モード切替ボタンの処理
    modeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;
      isPenMode = !isPenMode;

      if (isPenMode) {
        modeBtn.textContent = '✏️ ペンモード';
        modeBtn.className = 'btn btn-mode active-pen';
        viewerArea.classList.add('pen-active', 'pen-mode');
        penToolGroup.style.opacity = '1';
        penToolGroup.style.pointerEvents = 'auto';
      } else {
        modeBtn.textContent = '✋ 移動モード';
        modeBtn.className = 'btn btn-mode active-move';
        viewerArea.classList.remove('pen-active', 'pen-mode');
        penToolGroup.style.opacity = '0.5';
        penToolGroup.style.pointerEvents = 'none';
      }
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      imageList = files.map(file => ({
        name: file.name,
        url: URL.createObjectURL(file)
      }));

      renderThumbnails();
      loadImage(0);
    });

    function renderThumbnails() {
      thumbnailList.innerHTML = '';
      imageList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `thumb-item ${index === currentIndex ? 'active' : ''}`;
        const img = document.createElement('img');
        img.src = item.url;
        div.appendChild(img);
        
        div.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          loadImage(index);
        });
        thumbnailList.appendChild(div);
      });
    }

    function loadImage(index) {
      if (index < 0 || index >= imageList.length) return;
      currentIndex = index;
      strokes = [];

      Array.from(thumbnailList.children).forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      currentImg = new Image();
      currentImg.onload = () => {
        emptyState.style.display = 'none';
        canvasContainer.style.display = 'block';

        fitCanvasToViewer();
        redrawAll();
        updateNavButtons();
      };
      currentImg.src = imageList[index].url;
    }

    function fitCanvasToViewer() {
      const margin = 10;
      const maxWidth = viewerArea.clientWidth - margin;
      const maxHeight = viewerArea.clientHeight - margin;

      let width = currentImg.width;
      let height = currentImg.height;

      const scale = Math.min(maxWidth / width, maxHeight / height, 1);

      width = Math.round(width * scale);
      height = Math.round(height * scale);

      bgCanvas.width = width;
      bgCanvas.height = height;
      drawCanvas.width = width;
      drawCanvas.height = height;

      canvasContainer.style.width = width + 'px';
      canvasContainer.style.height = height + 'px';
    }

    function redrawAll() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.drawImage(currentImg, 0, 0, bgCanvas.width, bgCanvas.height);

      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        drawCtx.beginPath();
        drawCtx.strokeStyle = stroke.color;
        drawCtx.lineWidth = stroke.width;
        drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          drawCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        drawCtx.stroke();
      });
    }

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const scaleX = drawCanvas.width / rect.width;
      const scaleY = drawCanvas.height / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // 描画イベント（ペンモードが有効なときのみ動作）
    function startDrawing(e) {
      if (!isPenMode || currentIndex === -1) return;
      isDrawing = true;
      const pos = getPos(e);
      currentStroke = {
        color: currentColor,
        width: currentLineWidth,
        points: [pos]
      };
      strokes.push(currentStroke);
    }

    function draw(e) {
      if (!isPenMode || !isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      currentStroke.points.push(pos);
      redrawAll();
    }

    function stopDrawing() {
      if (!isPenMode) return;
      isDrawing = false;
      currentStroke = null;
    }

    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    drawCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);
    window.addEventListener('touchcancel', stopDrawing);

    // 色選択
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    lineWidthInput.addEventListener('input', (e) => {
      currentLineWidth = e.target.value;
    });

    undoBtn.addEventListener('click', (e) => {
      e.preventDefault();
      strokes.pop();
      redrawAll();
    });

    clearBtn.addEventListener('click', (e) => {
      e.preventDefault();
      strokes = [];
      redrawAll();
    });

    prevBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      loadImage(currentIndex - 1);
    });

    nextBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      loadImage(currentIndex + 1);
    });

    function updateNavButtons() {
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= imageList.length - 1;
      saveBtn.disabled = currentIndex === -1;
      undoBtn.disabled = currentIndex === -1;
      clearBtn.disabled = currentIndex === -1;
    }

    saveBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = currentImg.width;
      exportCanvas.height = currentImg.height;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.drawImage(currentImg, 0, 0);

      const scaleX = currentImg.width / bgCanvas.width;
      const scaleY = currentImg.height / bgCanvas.height;

      expCtx.lineCap = 'round';
      expCtx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        expCtx.beginPath();
        expCtx.strokeStyle = stroke.color;
        expCtx.lineWidth = stroke.width * scaleX;
        expCtx.moveTo(stroke.points[0].x * scaleX, stroke.points[0].y * scaleY);
        for (let i = 1; i < stroke.points.length; i++) {
          expCtx.lineTo(stroke.points[i].x * scaleX, stroke.points[i].y * scaleY);
        }
        expCtx.stroke();
      });

      const link = document.createElement('a');
      const originalName = imageList[currentIndex].name.replace(/\.[^/.]+$/, "");
      link.download = `${originalName}_memo.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    window.addEventListener('resize', () => {
      if (currentIndex !== -1) {
        fitCanvasToViewer();
        redrawAll();
      }
    });
  </script>
</body>
</html>
