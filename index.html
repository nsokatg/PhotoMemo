<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <link rel="apple-touch-icon" href="/PhotoMemo/photomemo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="写真メモ">
  <title>写真メモ</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --panel-bg: #2b2b36;
      --accent-color: #007acc;
      --text-color: #e0e0e0;
      --danger-color: #e63946;
    }

    html {
      background-color: var(--bg-color);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー・ツールバー（ホーム画面アプリ時のステータスバーと重ならないよう余白を確保） */
    header {
      background-color: var(--panel-bg);
      padding: 8px 12px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      padding-left: calc(12px + env(safe-area-inset-left, 0px));
      padding-right: calc(12px + env(safe-area-inset-right, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #3a3a4c;
      z-index: 10;
      flex-wrap: wrap;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.btn, button.btn {
      background-color: #3b3b4f;
      color: var(--text-color);
      border: 1px solid #55556a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
      transition: background-color 0.2s;
    }

    label.btn:active, button.btn:active {
      background-color: #55556a;
    }

    button.btn-primary, label.btn-primary {
      background-color: var(--accent-color);
      border-color: #005999;
    }

    button.btn-success {
      background-color: #2b6a3b;
      border-color: #3a8b4f;
      color: #b3ffc6;
    }

    button.btn-danger {
      background-color: #6a2b2b;
      border-color: #8b3a3a;
      color: #ffb3b3;
    }

    /* モード切替ボタンのアクティブ状態 */
    button.btn-mode.active-pen {
      background-color: #ff3b30;
      border-color: #cc2f26;
      color: #fff;
    }

    button.btn-mode.active-move {
      background-color: #34c759;
      border-color: #289c45;
      color: #fff;
    }

    button:disabled, label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    .color-picker {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    #lineWidth {
      width: 50px;
    }

    /* メインレイアウト */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* ビューワーエリア */
    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121216;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .viewer-area.pen-mode {
      touch-action: none;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .viewer-area.pen-active #drawCanvas {
      pointer-events: auto;
      cursor: crosshair;
      touch-action: none;
    }

    /* サムネイル一覧 */
    .sidebar {
      width: 130px;
      background-color: var(--panel-bg);
      border-right: 1px solid #3a3a4c;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    @media (max-width: 600px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: calc(80px + env(safe-area-inset-bottom, 0px));
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-top: 1px solid #3a3a4c;
        order: 2;
      }
      .viewer-area {
        order: 1;
      }
      .thumb-item {
        width: 72px !important;
        min-width: 72px !important;
        flex: 0 0 72px !important;
        height: 100% !important;
      }
    }

    .thumb-item {
      width: 100%;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background-color: #121216;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item.active {
      border-color: var(--accent-color);
    }

    .empty-state {
      position: absolute;
      text-align: center;
      color: #888899;
      pointer-events: none;
      padding: 20px;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 14px;
    }

    /* ===== カメラ撮影画面 ===== */
    .cam-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10, 10, 14, 0.98);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding:
        max(env(safe-area-inset-top, 0px), 10px)
        max(env(safe-area-inset-right, 0px), 12px)
        max(env(safe-area-inset-bottom, 0px), 10px)
        max(env(safe-area-inset-left, 0px), 12px);
    }

    .cam-modal.on {
      display: flex;
    }

    .cam-video-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      border-radius: 8px;
    }

    #camVideo {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
    }

    .cam-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .cam-bar select {
      max-width: 60vw;
      min-width: 140px;
      padding: 6px 8px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #55556a;
      background: #3b3b4f;
      color: var(--text-color);
    }

    .cam-shutter {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #e63946;
      cursor: pointer;
    }

    .cam-shutter:active {
      background: #b32d38;
    }

    .cam-shutter:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .cam-info {
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }

    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 50%;
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }

    .toast.on {
      opacity: 1;
    }

    /* ===== ボタンの折り返し防止・縦持ち（スマホ）向けレイアウト ===== */
    @media (max-width: 600px) {
      header {
        display: grid;
        grid-template-columns: 100%;
        gap: 6px;
        padding-bottom: 8px;
      }
      header .group {
        width: 100%;
        min-width: 0;
      }

      /* 1段目・3段目：等分割して、絵文字の下に文字を置く */
      .g-file, .g-out {
        display: grid;
        gap: 6px;
      }
      .g-file { grid-template-columns: repeat(4, 1fr); }
      .g-out  { grid-template-columns: repeat(5, 1fr); }

      .g-file .btn, .g-out .btn {
        flex-direction: column;
        gap: 2px;
        height: 52px;
        min-width: 0;
        padding: 4px 2px;
        font-size: 11px;
        line-height: 1.2;
      }
      .btn .ico { font-size: 20px; line-height: 1; }

      /* 2段目：モード切替は横幅いっぱい、その下に色・太さ・戻す・消しゴム */
      .g-pen {
        flex-wrap: wrap;
        gap: 6px;
      }
      .g-pen #modeBtn {
        flex: 1 1 100%;
        padding: 10px;
        font-size: 15px;
      }
      .g-pen #penToolGroup {
        flex: 1 1 0;
        min-width: 0;
        justify-content: space-between;
        gap: 4px;
      }
      .color-btn { width: 28px; height: 28px; flex: 0 0 28px; }
      #lineWidth { flex: 1 1 40px; width: auto; min-width: 40px; }
      .g-pen #undoBtn, .g-pen #clearBtn {
        flex: 0 0 44px;
        height: 38px;
        padding: 0;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- ツールバー -->
  <header>
    <div class="group g-file">
      <label class="btn btn-primary">
        <span class="ico">📷</span><span class="lbl">写真を開く</span>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button class="btn btn-success" id="cameraBtn" type="button" title="カメラを選んで撮影"><span class="ico">📸</span><span class="lbl">カメラ</span></button>
      <button class="btn" id="prevBtn" type="button" disabled><span class="ico">◀</span><span class="lbl">前へ</span></button>
      <button class="btn" id="nextBtn" type="button" disabled><span class="ico">▶</span><span class="lbl">次へ</span></button>
    </div>

    <div class="group g-pen">
      <button class="btn btn-mode active-move" id="modeBtn" type="button">✋ 移動モード</button>

      <div class="color-picker" id="penToolGroup" style="opacity: 0.5; pointer-events: none;">
        <div class="color-btn active" style="background:#ff3b30;" data-color="#ff3b30"></div>
        <div class="color-btn" style="background:#007aff;" data-color="#007aff"></div>
        <div class="color-btn" style="background:#ffcc00;" data-color="#ffcc00"></div>
        <div class="color-btn" style="background:#34c759;" data-color="#34c759"></div>
        <div class="color-btn" style="background:#ffffff;" data-color="#ffffff"></div>
        <input type="range" id="lineWidth" min="2" max="40" value="8">
      </div>

      <button class="btn" id="undoBtn" type="button" disabled title="1つ戻す">↩</button>
      <button class="btn" id="clearBtn" type="button" disabled title="描画のクリア">🧹</button>
    </div>

    <div class="group g-out">
      <button class="btn" id="copyBtn" type="button" disabled title="画像をクリップボードにコピー"><span class="ico">📋</span><span class="lbl">コピー</span></button>
      <button class="btn" id="shareBtn" type="button" disabled title="共有メニューを開く"><span class="ico">📤</span><span class="lbl">共有</span></button>
      <button class="btn btn-primary" id="saveBtn" type="button" disabled title="ファイルとしてダウンロード"><span class="ico">💾</span><span class="lbl">保存</span></button>
      <button class="btn btn-danger" id="deleteBtn" type="button" disabled title="この写真を削除"><span class="ico">🗑</span><span class="lbl">削除</span></button>
      <button class="btn btn-danger" id="clearAllBtn" type="button" title="全データ削除"><span class="ico">⚠️</span><span class="lbl">全消去</span></button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="main-container">
    <div class="sidebar" id="thumbnailList"></div>

    <div class="viewer-area" id="viewerArea">
      <div class="empty-state" id="emptyState">
        <svg width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>「写真を開く」または「カメラ」から写真を追加してください</p>
      </div>

      <div class="canvas-container" id="canvasContainer" style="display:none;">
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- カメラ撮影画面 -->
  <div class="cam-modal" id="camModal">
    <div class="cam-video-wrap">
      <video id="camVideo" autoplay playsinline muted></video>
    </div>
    <div class="cam-bar">
      <select id="camSelect" title="使用するカメラ"></select>
      <button class="btn" id="camSwitchBtn" type="button">🔄 切替</button>
    </div>
    <div class="cam-bar">
      <button class="btn" id="camCloseBtn" type="button">✖ 閉じる</button>
      <button class="cam-shutter" id="camShutterBtn" type="button" title="撮影"></button>
      <div class="cam-info" id="camInfo">撮影: 0枚</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 保存・共有する画像の形式（写真はJPEGのほうが軽くメールに添付しやすい。PNGに戻す場合は下の3行を変更）
    const EXPORT_MIME = 'image/jpeg';
    const EXPORT_EXT = 'jpg';
    const EXPORT_QUALITY = 0.92;

    let imageList = [];      // { id, seq, name, blob, url, strokes }
    let currentIndex = -1;
    let currentImg = null;   // 読み込み完了した表示中の画像（未完了の間は null）
    let loadToken = 0;       // 画像の読み込み競合を防ぐための番号
    let seqCounter = 0;      // 追加順を保つための連番

    let currentColor = '#ff3b30';
    let currentLineWidth = 8; // 画面上の太さ(px)。実際の保存時に画像サイズへ換算する
    let isPenMode = false;

    // 描画中の状態
    let activePointerId = null;
    let currentStroke = null;
    let drawingItem = null;

    const fileInput = document.getElementById('fileInput');
    const thumbnailList = document.getElementById('thumbnailList');
    const viewerArea = document.getElementById('viewerArea');
    const canvasContainer = document.getElementById('canvasContainer');
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const saveBtn = document.getElementById('saveBtn');
    const copyBtn = document.getElementById('copyBtn');
    const shareBtn = document.getElementById('shareBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const modeBtn = document.getElementById('modeBtn');
    const penToolGroup = document.getElementById('penToolGroup');
    const emptyState = document.getElementById('emptyState');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const lineWidthInput = document.getElementById('lineWidth');

    const cameraBtn = document.getElementById('cameraBtn');
    const camModal = document.getElementById('camModal');
    const camVideo = document.getElementById('camVideo');
    const camSelect = document.getElementById('camSelect');
    const camSwitchBtn = document.getElementById('camSwitchBtn');
    const camCloseBtn = document.getElementById('camCloseBtn');
    const camShutterBtn = document.getElementById('camShutterBtn');
    const camInfo = document.getElementById('camInfo');
    const toast = document.getElementById('toast');

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('on'), 2200);
    }

    // ---------- IndexedDB ----------
    const DB_NAME = 'PhotoMemoDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'photos';

    // 接続は1回だけ開いて使い回す
    let dbPromise = null;
    function openDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          request.onsuccess = () => {
            const db = request.result;
            db.onversionchange = () => { db.close(); dbPromise = null; };
            resolve(db);
          };
          request.onerror = () => reject(request.error);
        });
        dbPromise.catch(() => { dbPromise = null; });
      }
      return dbPromise;
    }

    async function saveImageToDB(item) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({
          id: item.id,
          seq: item.seq,
          name: item.name,
          blob: item.blob,
          strokes: item.strokes || []
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }

    async function deleteImageFromDB(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }

    async function clearAllFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }

    async function loadAllFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const request = tx.objectStore(STORE_NAME).getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // 保存失敗は、続けて何度も通知しない
    let dbErrorNotified = false;
    async function persist(item) {
      try {
        await saveImageToDB(item);
      } catch (err) {
        console.error('保存失敗:', err);
        if (!dbErrorNotified) {
          dbErrorNotified = true;
          alert('端末内への保存に失敗しました。空き容量やブラウザの設定（プライベートブラウズなど）をご確認ください。');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const storedItems = await loadAllFromDB();
        if (storedItems && storedItems.length > 0) {
          // 追加した順に並べる（旧データは seq が無いのでIDの順）
          storedItems.sort((a, b) => ((a.seq || 0) - (b.seq || 0)) || String(a.id).localeCompare(String(b.id)));
          imageList = storedItems.map(item => ({
            id: item.id,
            seq: item.seq || 0,
            name: item.name,
            blob: item.blob,
            url: URL.createObjectURL(item.blob),
            strokes: item.strokes || []
          }));
          seqCounter = Math.max(0, ...imageList.map(i => i.seq || 0));
          renderThumbnails();
          loadImage(0);
        }
      } catch (err) {
        console.error('DB初期ロード失敗:', err);
      }
    });

    // ---------- モード切替 ----------
    modeBtn.addEventListener('click', () => {
      if (currentIndex === -1) return;
      isPenMode = !isPenMode;

      if (isPenMode) {
        modeBtn.textContent = '✏️ ペンモード';
        modeBtn.className = 'btn btn-mode active-pen';
        viewerArea.classList.add('pen-active', 'pen-mode');
        penToolGroup.style.opacity = '1';
        penToolGroup.style.pointerEvents = 'auto';
      } else {
        modeBtn.textContent = '✋ 移動モード';
        modeBtn.className = 'btn btn-mode active-move';
        viewerArea.classList.remove('pen-active', 'pen-mode');
        penToolGroup.style.opacity = '0.5';
        penToolGroup.style.pointerEvents = 'none';
      }
    });

    // ---------- 写真の追加 ----------
    // 1枚を一覧に追加して端末内に保存する（ファイル選択・カメラ撮影の共通処理）
    // 戻り値: 端末内への保存に成功したか
    async function addPhotoItem(blob, name) {
      seqCounter = Math.max(seqCounter, Date.now());
      const item = {
        id: Date.now() + '_' + Math.random().toString(36).slice(2, 11),
        seq: ++seqCounter,
        name: name,
        blob: blob,
        url: URL.createObjectURL(blob),
        strokes: []
      };
      imageList.push(item);
      try {
        await saveImageToDB(item);
        return true;
      } catch (err) {
        console.error('保存失敗:', err);
        return false;
      }
    }

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const startIndex = imageList.length;
      let failed = 0;

      for (const file of files) {
        const ok = await addPhotoItem(file, file.name);
        if (!ok) failed++;
      }

      fileInput.value = '';
      renderThumbnails();
      if (imageList.length > startIndex) loadImage(startIndex);

      if (failed > 0) {
        alert(`${failed}枚の写真を端末内に保存できませんでした（このまま使えますが、閉じると消えます）。空き容量などをご確認ください。`);
      }
    });

    function renderThumbnails() {
      thumbnailList.innerHTML = '';
      imageList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `thumb-item ${index === currentIndex ? 'active' : ''}`;
        const img = document.createElement('img');
        img.src = item.url;
        img.alt = item.name;
        img.decoding = 'async';
        div.appendChild(img);

        div.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          loadImage(index);
        });
        thumbnailList.appendChild(div);
      });
    }

    // ---------- カメラ撮影 ----------
    // PCのカメラ（Surfaceなど）でも、使うカメラを選んで撮影できる
    const BACK_RE = /back|rear|environment|背面|外|リア/i;
    const FRONT_RE = /front|user|face|前面|内|フロント/i;

    let camStream = null;
    let camDeviceId = null;
    let camBusy = false;
    let camShotCount = 0;
    let camFirstNewIndex = -1;   // このセッションで最初に撮影した写真の位置
    let camFailed = 0;

    function stopCamStream() {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
      }
      camVideo.srcObject = null;
    }

    // deviceId指定（なければ外カメラ希望）でカメラを開く
    async function openCamStream(deviceId) {
      const base = { width: { ideal: 3840 }, height: { ideal: 2160 } };
      if (deviceId) {
        return navigator.mediaDevices.getUserMedia({
          video: Object.assign({ deviceId: { exact: deviceId } }, base),
          audio: false
        });
      }
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: Object.assign({ facingMode: { ideal: 'environment' } }, base),
          audio: false
        });
      } catch (e) {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
    }

    async function startCam(deviceId) {
      if (camBusy) return;
      camBusy = true;
      camShutterBtn.disabled = true;
      camSwitchBtn.disabled = true;
      camSelect.disabled = true;
      try {
        let s;
        try {
          s = await openCamStream(deviceId);
        } catch (e) {
          // 指定したカメラが開けなかった場合は、既定のカメラで開き直す
          if (deviceId) {
            showToast('そのカメラを開けませんでした。別のカメラで開きます');
            s = await openCamStream(null);
          } else {
            throw e;
          }
        }
        stopCamStream();
        camStream = s;
        camVideo.srcObject = camStream;
        const tr = camStream.getVideoTracks()[0];
        const st = tr.getSettings ? tr.getSettings() : {};
        camDeviceId = st.deviceId || deviceId || null;

        // インカメラは鏡のように左右反転して表示（保存する写真は反転しない）
        const isFront = st.facingMode ? st.facingMode === 'user' : !BACK_RE.test(tr.label);
        camVideo.style.transform = isFront ? 'scaleX(-1)' : 'none';

        await refreshCamList();
        try { await camVideo.play(); } catch (e) { /* autoplayで再生される */ }
      } catch (err) {
        console.error('カメラ起動失敗:', err);
        let msg = 'カメラを開けませんでした。';
        if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
          msg = 'カメラの使用が許可されていません。ブラウザのアドレスバー付近、またはWindowsの「設定 > プライバシーとセキュリティ > カメラ」で許可してください。';
        } else if (err && err.name === 'NotFoundError') {
          msg = 'カメラが見つかりませんでした。';
        } else if (err && err.name === 'NotReadableError') {
          msg = 'カメラを他のアプリが使用中の可能性があります。他のアプリを閉じてからやり直してください。';
        }
        alert(msg);
        closeCamera();
      } finally {
        camBusy = false;
        camShutterBtn.disabled = !camStream;
        camSwitchBtn.disabled = false;
        camSelect.disabled = false;
      }
    }

    // 接続されているカメラの一覧を作る（権限を得たあとでないと名前が取れない）
    async function refreshCamList() {
      try {
        const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
        camSelect.innerHTML = '';
        devices.forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || `カメラ ${i + 1}`;
          camSelect.appendChild(opt);
        });
        if (camDeviceId && devices.some(d => d.deviceId === camDeviceId)) {
          camSelect.value = camDeviceId;
        }
        camSwitchBtn.style.display = devices.length > 1 ? '' : 'none';
        camSelect.style.display = devices.length > 1 ? '' : 'none';
      } catch (e) {
        console.warn('カメラ一覧の取得に失敗:', e);
      }
    }

    function updateCamInfo() {
      camInfo.textContent = `撮影: ${camShotCount}枚`;
    }

    async function openCameraModal() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('このブラウザまたは接続方法ではカメラを使えません。HTTPSで開いているかご確認ください。');
        return;
      }
      camShotCount = 0;
      camFirstNewIndex = -1;
      camFailed = 0;
      updateCamInfo();
      camModal.classList.add('on');
      await startCam(null);
    }

    function closeCamera() {
      stopCamStream();
      camModal.classList.remove('on');

      renderThumbnails();
      if (camFirstNewIndex !== -1 && imageList.length > camFirstNewIndex) {
        loadImage(imageList.length - 1); // 最後に撮った写真を表示
      }
      if (camFailed > 0) {
        alert(`${camFailed}枚の写真を端末内に保存できませんでした（このまま使えますが、閉じると消えます）。空き容量などをご確認ください。`);
      }
      camFirstNewIndex = -1;
      camFailed = 0;
    }

    let shooting = false;
    async function takeCameraPhoto() {
      if (shooting || !camStream) return;
      const vw = camVideo.videoWidth;
      const vh = camVideo.videoHeight;
      if (!vw || !vh) return;

      shooting = true;
      camShutterBtn.disabled = true;
      try {
        const c = document.createElement('canvas');
        c.width = vw;
        c.height = vh;
        c.getContext('2d').drawImage(camVideo, 0, 0, vw, vh);
        const blob = await canvasToBlob(c, 'image/jpeg', 0.95);

        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        const name = `camera_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${p(camShotCount + 1)}.jpg`;

        if (camFirstNewIndex === -1) camFirstNewIndex = imageList.length;
        const ok = await addPhotoItem(blob, name);
        if (!ok) camFailed++;
        camShotCount++;
        updateCamInfo();
        showToast(`撮影しました（${camShotCount}枚）`);
      } catch (err) {
        console.error('撮影失敗:', err);
        showToast('撮影に失敗しました');
      } finally {
        shooting = false;
        camShutterBtn.disabled = !camStream;
      }
    }

    cameraBtn.addEventListener('click', openCameraModal);
    camCloseBtn.addEventListener('click', closeCamera);
    camShutterBtn.addEventListener('click', takeCameraPhoto);

    camSelect.addEventListener('change', () => {
      if (camSelect.value) startCam(camSelect.value);
    });

    // 🔄 切替：一覧の次のカメラへ（インとアウトの切替）
    camSwitchBtn.addEventListener('click', () => {
      const opts = Array.from(camSelect.options);
      if (opts.length < 2) return;
      const idx = opts.findIndex(o => o.value === camDeviceId);
      const next = opts[(idx + 1) % opts.length];
      startCam(next.value);
    });

    // ページを離れるときはカメラを止める
    window.addEventListener('pagehide', stopCamStream);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && camModal.classList.contains('on')) {
        stopCamStream();
        camShutterBtn.disabled = true;
      } else if (document.visibilityState === 'visible' && camModal.classList.contains('on') && !camStream) {
        startCam(camDeviceId);
      }
    });

    // ---------- 画像の表示 ----------
    function loadImage(index) {
      const token = ++loadToken;
      currentImg = null;

      if (index < 0 || index >= imageList.length) {
        currentIndex = -1;
        emptyState.style.display = 'block';
        canvasContainer.style.display = 'none';
        updateButtons();
        return;
      }

      currentIndex = index;
      Array.from(thumbnailList.children).forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      updateButtons();

      const img = new Image();
      img.onload = () => {
        if (token !== loadToken) return; // 後から別の画像が選ばれていたら無視
        currentImg = img;
        emptyState.style.display = 'none';
        canvasContainer.style.display = 'block';

        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        bgCanvas.width = w;
        bgCanvas.height = h;
        drawCanvas.width = w;
        drawCanvas.height = h;

        updateDisplaySize();
        bgCtx.drawImage(img, 0, 0, w, h); // 背景は読み込み時に1回だけ描画する
        redrawStrokes();
        updateButtons();
      };
      img.onerror = () => {
        if (token !== loadToken) return;
        alert('画像を読み込めませんでした。');
      };
      img.src = imageList[index].url;
    }

    // 画面に合わせた表示サイズだけを変更する（描画内容は消えない）
    function updateDisplaySize() {
      if (!currentImg) return;
      const margin = 10;
      const maxWidth = viewerArea.clientWidth - margin;
      const maxHeight = viewerArea.clientHeight - margin;
      const w = bgCanvas.width;
      const h = bgCanvas.height;

      const scale = Math.min(maxWidth / w, maxHeight / h, 1);
      canvasContainer.style.width = Math.round(w * scale) + 'px';
      canvasContainer.style.height = Math.round(h * scale) + 'px';
    }

    // ---------- 描画 ----------
    // 1本の線（点が1つだけならドットとして描く）
    function drawStroke(ctx, stroke) {
      const pts = stroke.points;
      if (!pts || pts.length === 0) return;

      ctx.strokeStyle = stroke.color;
      ctx.fillStyle = stroke.color;
      ctx.lineWidth = stroke.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (pts.length === 1) {
        ctx.beginPath();
        ctx.arc(pts[0].x, pts[0].y, stroke.width / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();
    }

    function redrawStrokes() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (currentIndex === -1) return;
      (imageList[currentIndex].strokes || []).forEach(stroke => drawStroke(drawCtx, stroke));
    }

    // 描画中は新しく増えた区間だけを描く（全体を描き直さない）
    function drawSegment(stroke, from, to) {
      drawCtx.strokeStyle = stroke.color;
      drawCtx.lineWidth = stroke.width;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.beginPath();
      drawCtx.moveTo(from.x, from.y);
      drawCtx.lineTo(to.x, to.y);
      drawCtx.stroke();
    }

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (drawCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (drawCanvas.height / rect.height)
      };
    }

    // 画面上の太さ(px)を画像上の太さに換算（高解像度の写真でも線が細くならない）
    function strokeWidthInImagePx() {
      const rect = drawCanvas.getBoundingClientRect();
      const scale = rect.width > 0 ? drawCanvas.width / rect.width : 1;
      return Math.max(1, Math.round(currentLineWidth * scale * 10) / 10);
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (!isPenMode || !currentImg || currentIndex === -1) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (activePointerId !== null) return; // 2本目の指は無視
      e.preventDefault();

      activePointerId = e.pointerId;
      drawCanvas.setPointerCapture(e.pointerId);

      drawingItem = imageList[currentIndex];
      currentStroke = {
        color: currentColor,
        width: strokeWidthInImagePx(),
        points: [getPos(e)]
      };
      drawingItem.strokes.push(currentStroke);
      drawStroke(drawCtx, currentStroke);
      updateButtons();
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== activePointerId || !currentStroke) return;
      e.preventDefault();

      const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      const events = coalesced.length > 0 ? coalesced : [e];
      for (const ev of events) {
        const pos = getPos(ev);
        const prev = currentStroke.points[currentStroke.points.length - 1];
        currentStroke.points.push(pos);
        drawSegment(currentStroke, prev, pos);
      }
    });

    async function endStroke(e) {
      if (e.pointerId !== activePointerId) return;
      activePointerId = null;
      const item = drawingItem;
      currentStroke = null;
      drawingItem = null;
      if (item) await persist(item);
    }

    drawCanvas.addEventListener('pointerup', endStroke);
    drawCanvas.addEventListener('pointercancel', endStroke);

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentColor = e.currentTarget.getAttribute('data-color');
      });
    });

    lineWidthInput.addEventListener('input', (e) => {
      currentLineWidth = Number(e.target.value);
    });

    undoBtn.addEventListener('click', async () => {
      if (currentIndex === -1) return;
      const item = imageList[currentIndex];
      if (item.strokes.length === 0) return;
      item.strokes.pop();
      redrawStrokes();
      updateButtons();
      await persist(item);
    });

    clearBtn.addEventListener('click', async () => {
      if (currentIndex === -1) return;
      const item = imageList[currentIndex];
      if (item.strokes.length === 0) return;
      if (!confirm('この写真の書き込みをすべて消しますか？')) return;
      item.strokes = [];
      redrawStrokes();
      updateButtons();
      await persist(item);
    });

    // ---------- 削除 ----------
    deleteBtn.addEventListener('click', async () => {
      if (currentIndex === -1) return;
      if (!confirm('表示中の写真メモを削除しますか？')) return;

      const itemToDelete = imageList[currentIndex];
      try {
        await deleteImageFromDB(itemToDelete.id);
      } catch (err) {
        console.error('削除失敗:', err);
        alert('削除に失敗しました。');
        return;
      }
      URL.revokeObjectURL(itemToDelete.url);

      const removedIndex = imageList.indexOf(itemToDelete);
      imageList.splice(removedIndex, 1);
      renderThumbnails();

      if (imageList.length === 0) {
        loadImage(-1);
      } else {
        loadImage(Math.min(removedIndex, imageList.length - 1));
      }
    });

    clearAllBtn.addEventListener('click', async () => {
      if (imageList.length === 0) return;
      if (!confirm('すべての写真メモを完全に削除しますか？')) return;

      try {
        await clearAllFromDB();
      } catch (err) {
        console.error('全削除失敗:', err);
        alert('削除に失敗しました。');
        return;
      }
      imageList.forEach(item => URL.revokeObjectURL(item.url));
      imageList = [];
      renderThumbnails();
      loadImage(-1);
    });

    prevBtn.addEventListener('click', () => loadImage(currentIndex - 1));
    nextBtn.addEventListener('click', () => loadImage(currentIndex + 1));

    function updateButtons() {
      const hasItem = currentIndex !== -1;
      const ready = hasItem && !!currentImg; // 画像の読み込みが終わっているか
      const strokeCount = hasItem ? imageList[currentIndex].strokes.length : 0;

      prevBtn.disabled = !hasItem || currentIndex <= 0;
      nextBtn.disabled = !hasItem || currentIndex >= imageList.length - 1;
      saveBtn.disabled = !ready;
      copyBtn.disabled = !ready;
      shareBtn.disabled = !ready;
      deleteBtn.disabled = !hasItem;
      undoBtn.disabled = strokeCount === 0;
      clearBtn.disabled = strokeCount === 0;
    }

    // ---------- 書き出し（保存・コピー・共有） ----------
    function generateExportCanvas() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = bgCanvas.width;
      exportCanvas.height = bgCanvas.height;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.drawImage(currentImg, 0, 0, exportCanvas.width, exportCanvas.height);
      (imageList[currentIndex].strokes || []).forEach(stroke => drawStroke(expCtx, stroke));
      return exportCanvas;
    }

    function canvasToBlob(canvas, mime, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('画像の生成に失敗しました。'));
        }, mime, quality);
      });
    }

    function exportFileName() {
      const originalName = imageList[currentIndex].name.replace(/\.[^/.]+$/, "");
      return `${originalName}_memo.${EXPORT_EXT}`;
    }

    // 💾 保存（ダウンロード）
    saveBtn.addEventListener('click', async () => {
      if (currentIndex === -1 || !currentImg) return;
      const fileName = exportFileName();
      saveBtn.disabled = true;
      try {
        const blob = await canvasToBlob(generateExportCanvas(), EXPORT_MIME, EXPORT_QUALITY);
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = fileName;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (err) {
        console.error('保存失敗:', err);
        alert('画像の保存に失敗しました。');
      } finally {
        updateButtons();
      }
    });

    // 📋 クリップボードにコピー（クリップボードはPNG形式）
    copyBtn.addEventListener('click', async () => {
      if (currentIndex === -1 || !currentImg) return;
      if (!navigator.clipboard || typeof ClipboardItem === 'undefined') {
        alert('お使いの環境またはブラウザではクリップボードへの画像コピーがサポートされていません。');
        return;
      }
      try {
        // Safariは「ボタンを押した直後」に書き込みを始める必要があるため、画像生成のPromiseをそのまま渡す
        const blobPromise = canvasToBlob(generateExportCanvas(), 'image/png');
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })]);
        alert('画像をクリップボードにコピーしました！メールなどにそのまま貼り付けできます。');
      } catch (err) {
        console.error('コピー失敗:', err);
        alert('画像のコピーに失敗しました。お使いの環境では未対応の可能性があります。');
      }
    });

    // 📤 共有 (Web Share API)
    shareBtn.addEventListener('click', async () => {
      if (currentIndex === -1 || !currentImg) return;
      const fileName = exportFileName();
      shareBtn.disabled = true;
      try {
        const blob = await canvasToBlob(generateExportCanvas(), EXPORT_MIME, EXPORT_QUALITY);
        const file = new File([blob], fileName, { type: EXPORT_MIME });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: '写真メモ',
            text: '写真メモを共有します'
          });
        } else {
          alert('お使いの環境では直接共有機能がサポートされていません。「保存」ボタンからファイルをダウンロードして添付してください。');
        }
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          alert('共有を開始できませんでした。もう一度「共有」を押してください。');
        } else if (err.name !== 'AbortError') {
          console.error('共有エラー:', err);
          alert('共有に失敗しました。');
        }
      } finally {
        updateButtons();
      }
    });

    // 画面サイズが変わっても描画内容は保持し、表示サイズだけを更新する
    let resizeFrame = null;
    window.addEventListener('resize', () => {
      if (resizeFrame) return;
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = null;
        updateDisplaySize();
      });
    });
  </script>
</body>
</html>
