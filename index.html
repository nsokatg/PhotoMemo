<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 正しい rel 属性に変更 -->
  <link rel="apple-touch-icon" href="/PhotoMemo/photomemo.png">
  
  <!-- iOS向けにホーム画面から起動した際のデザイン設定を追加 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="写真メモ">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>写真メモビューワー</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --panel-bg: #2b2b36;
      --accent-color: #007acc;
      --text-color: #e0e0e0;
      --danger-color: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー・ツールバー */
    header {
      background-color: var(--panel-bg);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #3a3a4c;
      z-index: 10;
      flex-wrap: wrap;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.btn, button.btn {
      background-color: #3b3b4f;
      color: var(--text-color);
      border: 1px solid #55556a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
      transition: background-color 0.2s;
    }

    label.btn:active, button.btn:active {
      background-color: #55556a;
    }

    button.btn-primary, label.btn-primary {
      background-color: var(--accent-color);
      border-color: #005999;
    }

    button.btn-danger {
      background-color: #6a2b2b;
      border-color: #8b3a3a;
      color: #ffb3b3;
    }

    /* モード切替ボタンのアクティブ状態 */
    button.btn-mode.active-pen {
      background-color: #ff3b30;
      border-color: #cc2f26;
      color: #fff;
    }

    button.btn-mode.active-move {
      background-color: #34c759;
      border-color: #289c45;
      color: #fff;
    }

    button:disabled, label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    .color-picker {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    /* メインレイアウト */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* ビューワーエリア */
    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121216;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .viewer-area.pen-mode {
      touch-action: none;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .viewer-area.pen-active #drawCanvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* サムネイル一覧 */
    .sidebar {
      width: 130px;
      background-color: var(--panel-bg);
      border-right: 1px solid #3a3a4c;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    @media (max-width: 600px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 80px;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-top: 1px solid #3a3a4c;
        order: 2;
      }
      .viewer-area {
        order: 1;
      }
      .thumb-item {
        min-width: 70px !important;
        height: 100% !important;
      }
    }

    .thumb-item {
      width: 100%;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background-color: #121216;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item.active {
      border-color: var(--accent-color);
    }

    .empty-state {
      position: absolute;
      text-align: center;
      color: #888899;
      pointer-events: none;
      padding: 20px;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ツールバー -->
  <header>
    <div class="group">
      <label class="btn btn-primary">
        📷 写真を開く
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button class="btn" id="prevBtn" type="button" disabled>前へ</button>
      <button class="btn" id="nextBtn" type="button" disabled>次へ</button>
    </div>

    <div class="group">
      <button class="btn btn-mode active-move" id="modeBtn" type="button">✋ 移動モード</button>

      <div class="color-picker" id="penToolGroup" style="opacity: 0.5; pointer-events: none;">
        <div class="color-btn active" style="background:#ff3b30;" data-color="#ff3b30"></div>
        <div class="color-btn" style="background:#007aff;" data-color="#007aff"></div>
        <div class="color-btn" style="background:#ffcc00;" data-color="#ffcc00"></div>
        <div class="color-btn" style="background:#34c759;" data-color="#34c759"></div>
        <div class="color-btn" style="background:#ffffff;" data-color="#ffffff"></div>
        <input type="range" id="lineWidth" min="2" max="40" value="8" style="width:50px;">
      </div>

      <button class="btn" id="undoBtn" type="button" disabled title="1つ戻す">↩</button>
      <button class="btn" id="clearBtn" type="button" disabled title="描画のクリア">🧹</button>
    </div>

    <div class="group">
      <button class="btn btn-danger" id="deleteBtn" type="button" disabled title="表示中の写真を削除">🗑 削除</button>
      <button class="btn btn-danger" id="clearAllBtn" type="button" title="全データ削除">全消去</button>
      <button class="btn btn-primary" id="saveBtn" type="button" disabled>💾 書き出し</button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="main-container">
    <div class="sidebar" id="thumbnailList"></div>

    <div class="viewer-area" id="viewerArea">
      <div class="empty-state" id="emptyState">
        <svg width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>「写真を開く」から画像を選択してください</p>
      </div>

      <div class="canvas-container" id="canvasContainer" style="display:none;">
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    let imageList = []; // { id, name, blob, url, strokes }
    let currentIndex = -1;

    let currentImg = new Image();
    let currentColor = '#ff3b30';
    let currentLineWidth = 8;
    let isDrawing = false;
    let isPenMode = false;

    const fileInput = document.getElementById('fileInput');
    const thumbnailList = document.getElementById('thumbnailList');
    const viewerArea = document.getElementById('viewerArea');
    const canvasContainer = document.getElementById('canvasContainer');
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const saveBtn = document.getElementById('saveBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const modeBtn = document.getElementById('modeBtn');
    const penToolGroup = document.getElementById('penToolGroup');
    const emptyState = document.getElementById('emptyState');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const lineWidthInput = document.getElementById('lineWidth');

    // IndexedDB の初期化と管理
    const DB_NAME = 'PhotoMemoDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'photos';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveImageToDB(item) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({
          id: item.id,
          name: item.name,
          blob: item.blob,
          strokes: item.strokes || []
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function deleteImageFromDB(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function clearAllFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadAllFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // 初期起動時のデータ読み込み
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const storedItems = await loadAllFromDB();
        if (storedItems && storedItems.length > 0) {
          imageList = storedItems.map(item => ({
            id: item.id,
            name: item.name,
            blob: item.blob,
            url: URL.createObjectURL(item.blob),
            strokes: item.strokes || []
          }));
          renderThumbnails();
          loadImage(0);
        }
      } catch (err) {
        console.error('DB初期ロード失敗:', err);
      }
    });

    modeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;
      isPenMode = !isPenMode;

      if (isPenMode) {
        modeBtn.textContent = '✏️ ペンモード';
        modeBtn.className = 'btn btn-mode active-pen';
        viewerArea.classList.add('pen-active', 'pen-mode');
        penToolGroup.style.opacity = '1';
        penToolGroup.style.pointerEvents = 'auto';
      } else {
        modeBtn.textContent = '✋ 移動モード';
        modeBtn.className = 'btn btn-mode active-move';
        viewerArea.classList.remove('pen-active', 'pen-mode');
        penToolGroup.style.opacity = '0.5';
        penToolGroup.style.pointerEvents = 'none';
      }
    });

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const startIndex = imageList.length;

      for (const file of files) {
        const item = {
          id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          name: file.name,
          blob: file,
          url: URL.createObjectURL(file),
          strokes: []
        };
        imageList.push(item);
        await saveImageToDB(item);
      }

      renderThumbnails();
      loadImage(startIndex);
      fileInput.value = '';
    });

    function renderThumbnails() {
      thumbnailList.innerHTML = '';
      imageList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `thumb-item ${index === currentIndex ? 'active' : ''}`;
        const img = document.createElement('img');
        img.src = item.url;
        div.appendChild(img);
        
        div.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          loadImage(index);
        });
        thumbnailList.appendChild(div);
      });
    }

    function loadImage(index) {
      if (index < 0 || index >= imageList.length) {
        currentIndex = -1;
        emptyState.style.display = 'block';
        canvasContainer.style.display = 'none';
        updateNavButtons();
        return;
      }

      currentIndex = index;

      Array.from(thumbnailList.children).forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      currentImg = new Image();
      currentImg.onload = () => {
        emptyState.style.display = 'none';
        canvasContainer.style.display = 'block';

        fitCanvasToViewer();
        redrawAll();
        updateNavButtons();
      };
      currentImg.src = imageList[index].url;
    }

    function fitCanvasToViewer() {
      if (currentIndex === -1) return;
      const margin = 10;
      const maxWidth = viewerArea.clientWidth - margin;
      const maxHeight = viewerArea.clientHeight - margin;

      bgCanvas.width = currentImg.width;
      bgCanvas.height = currentImg.height;
      drawCanvas.width = currentImg.width;
      drawCanvas.height = currentImg.height;

      const scale = Math.min(maxWidth / currentImg.width, maxHeight / currentImg.height, 1);
      const displayWidth = Math.round(currentImg.width * scale);
      const displayHeight = Math.round(currentImg.height * scale);

      canvasContainer.style.width = displayWidth + 'px';
      canvasContainer.style.height = displayHeight + 'px';
    }

    function redrawAll() {
      if (currentIndex === -1) return;

      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.drawImage(currentImg, 0, 0, bgCanvas.width, bgCanvas.height);

      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      const currentStrokes = imageList[currentIndex].strokes || [];
      currentStrokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        drawCtx.beginPath();
        drawCtx.strokeStyle = stroke.color;
        drawCtx.lineWidth = stroke.width;
        drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          drawCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        drawCtx.stroke();
      });
    }

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const scaleX = drawCanvas.width / rect.width;
      const scaleY = drawCanvas.height / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function startDrawing(e) {
      if (!isPenMode || currentIndex === -1) return;
      isDrawing = true;
      const pos = getPos(e);
      const currentStroke = {
        color: currentColor,
        width: currentLineWidth,
        points: [pos]
      };
      imageList[currentIndex].strokes.push(currentStroke);
    }

    function draw(e) {
      if (!isPenMode || !isDrawing || currentIndex === -1) return;
      e.preventDefault();
      const pos = getPos(e);
      const strokes = imageList[currentIndex].strokes;
      strokes[strokes.length - 1].points.push(pos);
      redrawAll();
    }

    async function stopDrawing() {
      if (!isPenMode || !isDrawing) return;
      isDrawing = false;
      if (currentIndex !== -1) {
        await saveImageToDB(imageList[currentIndex]);
      }
    }

    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    drawCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);
    window.addEventListener('touchcancel', stopDrawing);

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    lineWidthInput.addEventListener('input', (e) => {
      currentLineWidth = e.target.value;
    });

    undoBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;
      imageList[currentIndex].strokes.pop();
      redrawAll();
      await saveImageToDB(imageList[currentIndex]);
    });

    clearBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;
      imageList[currentIndex].strokes = [];
      redrawAll();
      await saveImageToDB(imageList[currentIndex]);
    });

    deleteBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;

      if (confirm('表示中の写真メモを削除しますか？')) {
        const itemToDelete = imageList[currentIndex];
        await deleteImageFromDB(itemToDelete.id);
        URL.revokeObjectURL(itemToDelete.url);

        imageList.splice(currentIndex, 1);
        renderThumbnails();

        if (imageList.length === 0) {
          loadImage(-1);
        } else {
          const nextIndex = currentIndex >= imageList.length ? imageList.length - 1 : currentIndex;
          loadImage(nextIndex);
        }
      }
    });

    clearAllBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      if (imageList.length === 0) return;

      if (confirm('すべての写真メモを完全に削除しますか？')) {
        await clearAllFromDB();
        imageList.forEach(item => URL.revokeObjectURL(item.url));
        imageList = [];
        renderThumbnails();
        loadImage(-1);
      }
    });

    prevBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      loadImage(currentIndex - 1);
    });

    nextBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      loadImage(currentIndex + 1);
    });

    function updateNavButtons() {
      const hasImage = currentIndex !== -1;
      prevBtn.disabled = !hasImage || currentIndex <= 0;
      nextBtn.disabled = !hasImage || currentIndex >= imageList.length - 1;
      saveBtn.disabled = !hasImage;
      deleteBtn.disabled = !hasImage;
      undoBtn.disabled = !hasImage;
      clearBtn.disabled = !hasImage;
    }

    saveBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = currentImg.width;
      exportCanvas.height = currentImg.height;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.drawImage(currentImg, 0, 0);

      expCtx.lineCap = 'round';
      expCtx.lineJoin = 'round';

      const currentStrokes = imageList[currentIndex].strokes || [];
      currentStrokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        expCtx.beginPath();
        expCtx.strokeStyle = stroke.color;
        expCtx.lineWidth = stroke.width;
        expCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          expCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        expCtx.stroke();
      });

      const link = document.createElement('a');
      const originalName = imageList[currentIndex].name.replace(/\.[^/.]+$/, "");
      link.download = `${originalName}_memo.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    window.addEventListener('resize', () => {
      if (currentIndex !== -1) {
        fitCanvasToViewer();
        redrawAll();
      }
    });
  </script>
</body>
</html>
