<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写真メモビューワー</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --panel-bg: #2b2b36;
      --accent-color: #007acc;
      --text-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー・ツールバー */
    header {
      background-color: var(--panel-bg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #3a3a4c;
      z-index: 10;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label.btn, button.btn {
      background-color: #3b3b4f;
      color: var(--text-color);
      border: 1px solid #55556a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: background-color 0.2s;
    }

    label.btn:hover, button.btn:hover {
      background-color: #4c4c64;
    }

    button.btn-primary {
      background-color: var(--accent-color);
      border-color: #005999;
    }

    button.btn-primary:hover {
      background-color: #005999;
    }

    button:disabled, label.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    .color-picker {
      display: flex;
      gap: 6px;
    }

    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    /* メインレイアウト */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* サムネイルサイドバー */
    .sidebar {
      width: 140px;
      background-color: var(--panel-bg);
      border-right: 1px solid #3a3a4c;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thumb-item {
      width: 100%;
      height: 90px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background-color: #121216;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item.active {
      border-color: var(--accent-color);
    }

    /* ビューワーエリア */
    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121216;
      overflow: hidden;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      touch-action: none; /* スマホ・タブレットの手書きスクロール防止 */
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
    }

    .empty-state {
      position: absolute;
      text-align: center;
      color: #888899;
      pointer-events: none;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ツールバー -->
  <header>
    <div class="group">
      <label class="btn btn-primary">
        📷 写真を開く
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button class="btn" id="prevBtn" disabled>◀ 前へ</button>
      <button class="btn" id="nextBtn" disabled>次へ ▶</button>
    </div>

    <div class="group">
      <!-- ペン設定 -->
      <span style="font-size:13px; color:#aaa;">色:</span>
      <div class="color-picker">
        <div class="color-btn active" style="background:#ff3b30;" data-color="#ff3b30"></div>
        <div class="color-btn" style="background:#007aff;" data-color="#007aff"></div>
        <div class="color-btn" style="background:#ffcc00;" data-color="#ffcc00"></div>
        <div class="color-btn" style="background:#34c759;" data-color="#34c759"></div>
        <div class="color-btn" style="background:#000000; border: 1px solid #666;" data-color="#000000"></div>
        <div class="color-btn" style="background:#ffffff;" data-color="#ffffff"></div>
      </div>

      <span style="font-size:13px; color:#aaa; margin-left:8px;">太さ:</span>
      <input type="range" id="lineWidth" min="2" max="20" value="4" style="width:70px;">

      <button class="btn" id="undoBtn">↩ 戻す</button>
      <button class="btn" id="clearBtn">🗑 クリア</button>
    </div>

    <div class="group">
      <button class="btn btn-primary" id="saveBtn" disabled>💾 メモ付き保存</button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="main-container">
    <!-- 左側サムネイル -->
    <div class="sidebar" id="thumbnailList"></div>

    <!-- 右側中央ビューワー -->
    <div class="viewer-area" id="viewerArea">
      <div class="empty-state" id="emptyState">
        <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>上部の「写真を開く」ボタンから画像を選択してください</p>
      </div>

      <div class="canvas-container" id="canvasContainer" style="display:none;">
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // 状態管理
    let imageList = [];
    let currentIndex = -1;

    let currentImg = new Image();
    let currentColor = '#ff3b30';
    let currentLineWidth = 4;
    let strokes = []; // 手書き履歴 (Undo用)
    let currentStroke = null;
    let isDrawing = false;

    // DOM要素
    const fileInput = document.getElementById('fileInput');
    const thumbnailList = document.getElementById('thumbnailList');
    const viewerArea = document.getElementById('viewerArea');
    const canvasContainer = document.getElementById('canvasContainer');
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const saveBtn = document.getElementById('saveBtn');
    const emptyState = document.getElementById('emptyState');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const lineWidthInput = document.getElementById('lineWidth');

    // 画像読み込みイベント
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      imageList = files.map(file => ({
        name: file.name,
        url: URL.createObjectURL(file)
      }));

      renderThumbnails();
      loadImage(0);
    });

    // サムネイル表示
    function renderThumbnails() {
      thumbnailList.innerHTML = '';
      imageList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `thumb-item ${index === currentIndex ? 'active' : ''}`;
        const img = document.createElement('img');
        img.src = item.url;
        div.appendChild(img);
        div.addEventListener('click', () => loadImage(index));
        thumbnailList.appendChild(div);
      });
    }

    // 画像セット
    function loadImage(index) {
      if (index < 0 || index >= imageList.length) return;
      currentIndex = index;
      strokes = []; // メモのリセット

      // サムネイル選択状態の更新
      Array.from(thumbnailList.children).forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      currentImg = new Image();
      currentImg.onload = () => {
        emptyState.style.display = 'none';
        canvasContainer.style.display = 'block';

        fitCanvasToViewer();
        redrawAll();
        updateNavButtons();
      };
      currentImg.src = imageList[index].url;
    }

    // ビューワーサイズに合わせたキャンバスリサイズ
    function fitCanvasToViewer() {
      const margin = 20;
      const maxWidth = viewerArea.clientWidth - margin;
      const maxHeight = viewerArea.clientHeight - margin;

      let width = currentImg.width;
      let height = currentImg.height;

      const scale = Math.min(maxWidth / width, maxHeight / height, 1);

      width = Math.round(width * scale);
      height = Math.round(height * scale);

      bgCanvas.width = width;
      bgCanvas.height = height;
      drawCanvas.width = width;
      drawCanvas.height = height;

      canvasContainer.style.width = width + 'px';
      canvasContainer.style.height = height + 'px';
    }

    // 描画処理
    function redrawAll() {
      // 背景画像の描画
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.drawImage(currentImg, 0, 0, bgCanvas.width, bgCanvas.height);

      // 手書きメモの描画
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        drawCtx.beginPath();
        drawCtx.strokeStyle = stroke.color;
        drawCtx.lineWidth = stroke.width;
        drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          drawCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        drawCtx.stroke();
      });
    }

    // マウス / タッチ位置取得
    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // 手書きイベント登録
    function startDrawing(e) {
      if (currentIndex === -1) return;
      isDrawing = true;
      const pos = getPos(e);
      currentStroke = {
        color: currentColor,
        width: currentLineWidth,
        points: [pos]
      };
      strokes.push(currentStroke);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      currentStroke.points.push(pos);
      redrawAll();
    }

    function stopDrawing() {
      isDrawing = false;
      currentStroke = null;
    }

    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    drawCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    // 色変更
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    // 太さ変更
    lineWidthInput.addEventListener('input', (e) => {
      currentLineWidth = e.target.value;
    });

    // Undo (1つ戻す)
    undoBtn.addEventListener('click', () => {
      strokes.pop();
      redrawAll();
    });

    // クリア
    clearBtn.addEventListener('click', () => {
      strokes = [];
      redrawAll();
    });

    // 次へ・前へボタン
    prevBtn.addEventListener('click', () => loadImage(currentIndex - 1));
    nextBtn.addEventListener('click', () => loadImage(currentIndex + 1));

    function updateNavButtons() {
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= imageList.length - 1;
      saveBtn.disabled = currentIndex === -1;
    }

    // 保存（写真＋手書きを合成）
    saveBtn.addEventListener('click', () => {
      if (currentIndex === -1) return;

      // 保存用のOff-screen Canvasを作成（元の画像解像度に合わせて保存）
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = currentImg.width;
      exportCanvas.height = currentImg.height;
      const expCtx = exportCanvas.getContext('2d');

      // 1. 元画像を描画
      expCtx.drawImage(currentImg, 0, 0);

      // 2. 拡大表示倍率に合わせてスケール計算し、手書きメモを重畳
      const scaleX = currentImg.width / bgCanvas.width;
      const scaleY = currentImg.height / bgCanvas.height;

      expCtx.lineCap = 'round';
      expCtx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        expCtx.beginPath();
        expCtx.strokeStyle = stroke.color;
        expCtx.lineWidth = stroke.width * scaleX;
        expCtx.moveTo(stroke.points[0].x * scaleX, stroke.points[0].y * scaleY);
        for (let i = 1; i < stroke.points.length; i++) {
          expCtx.lineTo(stroke.points[i].x * scaleX, stroke.points[i].y * scaleY);
        }
        expCtx.stroke();
      });

      // 3. ダウンロード処理
      const link = document.createElement('a');
      const originalName = imageList[currentIndex].name.replace(/\.[^/.]+$/, "");
      link.download = `${originalName}_memo.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    // ウインドウリサイズ時の追従
    window.addEventListener('resize', () => {
      if (currentIndex !== -1) {
        fitCanvasToViewer();
        redrawAll();
      }
    });
  </script>
</body>
</html>
