<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>写真メモビューワー</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --panel-bg: #2b2b36;
      --accent-color: #007acc;
      --text-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー・ツールバー */
    header {
      background-color: var(--panel-bg);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #3a3a4c;
      z-index: 10;
      flex-wrap: wrap;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.btn, button.btn {
      background-color: #3b3b4f;
      color: var(--text-color);
      border: 1px solid #55556a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
      transition: background-color 0.2s;
    }

    label.btn:active, button.btn:active {
      background-color: #55556a;
    }

    button.btn-primary, label.btn-primary {
      background-color: var(--accent-color);
      border-color: #005999;
    }

    button:disabled, label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    .color-picker {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    /* メインレイアウト */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* ビューワーエリア（拡大スクロール可能領域） */
    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121216;
      overflow: auto; /* 拡大時のスクロールを許可 */
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom; /* ブラウザ標準の拡大・移動を許可 */
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transform-origin: center center;
    }

    canvas {
      display: block;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      touch-action: none; /* キャンバス上では1本指描画を処理 */
    }

    /* サムネイル一覧 */
    .sidebar {
      width: 130px;
      background-color: var(--panel-bg);
      border-right: 1px solid #3a3a4c;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    @media (max-width: 600px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 80px;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-top: 1px solid #3a3a4c;
        order: 2;
      }
      .viewer-area {
        order: 1;
      }
      .thumb-item {
        min-width: 70px !important;
        height: 100% !important;
      }
    }

    .thumb-item {
      width: 100%;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background-color: #121216;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item.active {
      border-color: var(--accent-color);
    }

    .empty-state {
      position: absolute;
      text-align: center;
      color: #888899;
      pointer-events: none;
      padding: 20px;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ツールバー -->
  <header>
    <div class="group">
      <label class="btn btn-primary">
        📷 写真を開く
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button class="btn" id="prevBtn" type="button" disabled>前へ</button>
      <button class="btn" id="nextBtn" type="button" disabled>次へ</button>
    </div>

    <div class="group">
      <div class="color-picker">
        <div class="color-btn active" style="background:#ff3b30;" data-color="#ff3b30"></div>
        <div class="color-btn" style="background:#007aff;" data-color="#007aff"></div>
        <div class="color-btn" style="background:#ffcc00;" data-color="#ffcc00"></div>
        <div class="color-btn" style="background:#34c759;" data-color="#34c759"></div>
        <div class="color-btn" style="background:#ffffff;" data-color="#ffffff"></div>
      </div>

      <input type="range" id="lineWidth" min="2" max="20" value="4" style="width:60px;">

      <button class="btn" id="undoBtn" type="button">↩</button>
      <button class="btn" id="clearBtn" type="button">🗑</button>
    </div>

    <div class="group">
      <button class="btn btn-primary" id="saveBtn" type="button" disabled>💾 保存</button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="main-container">
    <!-- サムネイル一覧 -->
    <div class="sidebar" id="thumbnailList"></div>

    <!-- 中央ビューワー -->
    <div class="viewer-area" id="viewerArea">
      <div class="empty-state" id="emptyState">
        <svg width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>「写真を開く」から画像を選択してください</p>
      </div>

      <div class="canvas-container" id="canvasContainer" style="display:none;">
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    let imageList = [];
    let currentIndex = -1;

    let currentImg = new Image();
    let currentColor = '#ff3b30';
    let currentLineWidth = 4;
    let strokes = [];
    let currentStroke = null;
    let isDrawing = false;

    const fileInput = document.getElementById('fileInput');
    const thumbnailList = document.getElementById('thumbnailList');
    const viewerArea = document.getElementById('viewerArea');
    const canvasContainer = document.getElementById('canvasContainer');
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const saveBtn = document.getElementById('saveBtn');
    const emptyState = document.getElementById('emptyState');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const lineWidthInput = document.getElementById('lineWidth');

    // 写真選択
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      imageList = files.map(file => ({
        name: file.name,
        url: URL.createObjectURL(file)
      }));

      renderThumbnails();
      loadImage(0);
    });

    function renderThumbnails() {
      thumbnailList.innerHTML = '';
      imageList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `thumb-item ${index === currentIndex ? 'active' : ''}`;
        const img = document.createElement('img');
        img.src = item.url;
        div.appendChild(img);
        
        div.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          loadImage(index);
        });
        thumbnailList.appendChild(div);
      });
    }

    function loadImage(index) {
      if (index < 0 || index >= imageList.length) return;
      currentIndex = index;
      strokes = [];

      Array.from(thumbnailList.children).forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      currentImg = new Image();
      currentImg.onload = () => {
        emptyState.style.display = 'none';
        canvasContainer.style.display = 'block';

        fitCanvasToViewer();
        redrawAll();
        updateNavButtons();
      };
      currentImg.src = imageList[index].url;
    }

    function fitCanvasToViewer() {
      const margin = 10;
      const maxWidth = viewerArea.clientWidth - margin;
      const maxHeight = viewerArea.clientHeight - margin;

      let width = currentImg.width;
      let height = currentImg.height;

      const scale = Math.min(maxWidth / width, maxHeight / height, 1);

      width = Math.round(width * scale);
      height = Math.round(height * scale);

      bgCanvas.width = width;
      bgCanvas.height = height;
      drawCanvas.width = width;
      drawCanvas.height = height;

      canvasContainer.style.width = width + 'px';
      canvasContainer.style.height = height + 'px';
    }

    function redrawAll() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.drawImage(currentImg, 0, 0, bgCanvas.width, bgCanvas.height);

      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        drawCtx.beginPath();
        drawCtx.strokeStyle = stroke.color;
        drawCtx.lineWidth = stroke.width;
        drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          drawCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        drawCtx.stroke();
      });
    }

    // 拡大表示にも追従する確実な座標取得
    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      // 拡大率に対応した倍率補正
      const scaleX = drawCanvas.width / rect.width;
      const scaleY = drawCanvas.height / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // --- 描画＆ピンチ操作の切り分け ---
    function startDrawing(e) {
      if (currentIndex === -1) return;

      // 2本指以上の操作はピンチズーム（拡大・移動）に委ねる
      if (e.touches && e.touches.length > 1) {
        if (isDrawing) {
          strokes.pop(); // ズーム開始前の最初の点を取り除く
          isDrawing = false;
          currentStroke = null;
          redrawAll();
        }
        return;
      }

      isDrawing = true;
      const pos = getPos(e);
      currentStroke = {
        color: currentColor,
        width: currentLineWidth,
        points: [pos]
      };
      strokes.push(currentStroke);
    }

    function draw(e) {
      // 2本指操作になったら手書きを中断
      if (e.touches && e.touches.length > 1) {
        if (isDrawing) {
          strokes.pop();
          isDrawing = false;
          currentStroke = null;
          redrawAll();
        }
        return;
      }

      if (!isDrawing) return;

      // 1本指の手書き入力時は画面の余計なスクロールを阻止
      e.preventDefault();
      const pos = getPos(e);
      currentStroke.points.push(pos);
      redrawAll();
    }

    function stopDrawing(e) {
      if (e.touches && e.touches.length > 0) return;
      isDrawing = false;
      currentStroke = null;
    }

    // マウスイベント
    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    // タッチイベント
    drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    drawCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);
    window.addEventListener('touchcancel', stopDrawing);

    // 色選択
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    lineWidthInput.addEventListener('input', (e) => {
      currentLineWidth = e.target.value;
    });

    undoBtn.addEventListener('click', (e) => {
      e.preventDefault();
      strokes.pop();
      redrawAll();
    });

    clearBtn.addEventListener('click', (e) => {
      e.preventDefault();
      strokes = [];
      redrawAll();
    });

    // 前へ・次へボタンの動作維持
    prevBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      loadImage(currentIndex - 1);
    });

    nextBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      loadImage(currentIndex + 1);
    });

    function updateNavButtons() {
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= imageList.length - 1;
      saveBtn.disabled = currentIndex === -1;
    }

    // 保存処理
    saveBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentIndex === -1) return;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = currentImg.width;
      exportCanvas.height = currentImg.height;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.drawImage(currentImg, 0, 0);

      const scaleX = currentImg.width / bgCanvas.width;
      const scaleY = currentImg.height / bgCanvas.height;

      expCtx.lineCap = 'round';
      expCtx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        expCtx.beginPath();
        expCtx.strokeStyle = stroke.color;
        expCtx.lineWidth = stroke.width * scaleX;
        expCtx.moveTo(stroke.points[0].x * scaleX, stroke.points[0].y * scaleY);
        for (let i = 1; i < stroke.points.length; i++) {
          expCtx.lineTo(stroke.points[i].x * scaleX, stroke.points[i].y * scaleY);
        }
        expCtx.stroke();
      });

      const link = document.createElement('a');
      const originalName = imageList[currentIndex].name.replace(/\.[^/.]+$/, "");
      link.download = `${originalName}_memo.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    window.addEventListener('resize', () => {
      if (currentIndex !== -1) {
        fitCanvasToViewer();
        redrawAll();
      }
    });
  </script>
</body>
</html>
